# 分层用例。便宜的先跑。
# automated: true  -> eval_runner 调用 tools/<runner>.py 并与 expect 比对
# automated: false -> eval_runner 读取 evals/runs/<id>.json（人工填写），缺失记 PENDING
cases:
  - id: adc-001-repro-log
    layer: log
    name: ADC 采样窗口落在开关振铃区（复现）
    automated: true
    runner: log
    args: ["examples/adc_sampling_bug/input/serial_before.log", "--rules", "evals/log_rules/adc_repro.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: failed
        op: eq
        value: 0

  - id: adc-002-fixed-log
    layer: log
    name: ADC 采样窗口后移后（修复验证）
    automated: true
    runner: log
    args: ["examples/adc_sampling_bug/input/serial_after.log", "--rules", "evals/log_rules/adc_fixed.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: passed
        op: ge
        value: 5

  - id: pwm-001-repro-log
    layer: log
    name: UCC20225 输入有 PWM、输出无波形（复现）
    automated: true
    runner: log
    args: ["examples/pwm_issue/input/serial_before.log", "--rules", "evals/log_rules/pwm_before.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: pwm-002-fixed-log
    layer: log
    name: UCC20225 返修后输出恢复（修复验证）
    automated: true
    runner: log
    args: ["examples/pwm_issue/input/serial_after.log", "--rules", "evals/log_rules/pwm_after.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: static-001-diff-rules
    layer: static
    name: diff 静态规则检查（应检出中断内阻塞调用与魔法数）
    automated: true
    runner: static
    args: ["--diff", "samples/sample.diff"]
    expect:
      - path: rules_triggered
        op: contains
        value: CR-001
      - path: rules_triggered
        op: contains
        value: CR-003
      - path: findings_count
        op: ge
        value: 3

  - id: motor-001-axis-estimation
    layer: algorithm
    name: 六脉冲二维电流增量 -> LS 连续轴线估计
    automated: true
    runner: test
    args: ["--cmd", "{python} examples/motor_control/scripts/estimate_axis.py examples/motor_control/input/six_pulse_samples.csv"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.mae_ls_deg
        op: le
        value: ${mae_deg_max}
      - path: metrics.mae_maxch_deg
        op: gt
        value: ${mae_deg_max}

  - id: compile-001-h743
    layer: compile
    name: H743 固件编译（无工具链时记为 SKIPPED）
    automated: true
    runner: build
    args: ["--config", "configs/keil.example.json"]
    expect:
      - path: status
        op: in
        value: [PASS, SKIPPED]
      - path: errors
        op: eq
        value: 0

  - id: rag-001-retrieval-quality
    layer: rag
    name: 知识库检索质量（15 条查询 recall@3）
    automated: true
    runner: rag
    args: ["--cases", "evals/rag_cases.yaml", "--k", "3"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.recall_at_k
        op: ge
        value: ${rag_recall3_min}
      - path: metrics.mrr
        op: ge
        value: ${rag_mrr_min}

  - id: mcp-001-conformance
    layer: mcp
    name: MCP 工具层一致性（握手 + tools + resources + prompts + 真实调用）
    automated: true
    runner: mcp
    args: ["--check"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: tools_count
        op: ge
        value: ${mcp_tools_min}
      - path: resources_count
        op: ge
        value: 10
      - path: kb_hits
        op: ge
        value: 1
      - path: log_check_status
        op: eq
        value: PASS

  - id: pwm-003-hardware
    layer: hardware
    name: 实机确认驱动输出（人工：示波器测相 A 输出）
    automated: false
    runner: manual
    expect:
      - path: measured.pwm_output_ok
        op: eq
        value: true

  - id: adc-003-hardware
    layer: hardware
    name: 实机确认 ADC 有效位（人工：限流电源 + 串口统计）
    automated: false
    runner: manual
    expect:
      - path: measured.adc_rms
        op: le
        value: ${adc_rms_max}

  - id: rag-002-vector-hybrid
    layer: rag
    name: 向量检索 + BM25 混合（对比词法基线，不允许变差）
    automated: true
    runner: vector
    args: ["--cases", "evals/rag_cases.yaml", "--k", "3"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.hybrid_recall_at_k
        op: ge
        value: ${vector_recall3_min}

  - id: memory-001-project-memory
    layer: agent
    name: 跨任务项目记忆（从 trace 取回历史决策与失败原因）
    automated: true
    runner: memory
    args: ["--k", "3"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.tasks
        op: ge
        value: 1
      - path: metrics.recall_at_k
        op: ge
        value: 1.0

  - id: security-001-tool-policy
    layer: security
    name: 工具级策略：白名单、危险动作人工批准、注入消毒、审计留痕
    automated: true
    runner: security
    args: []
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.injection_findings
        op: ge
        value: 2
      - path: metrics.audit_entries
        op: ge
        value: 3

  - id: cost-001-budget-and-cache
    layer: cost
    name: 成本治理：路由、token 预算硬停、Prompt 缓存命中与费用估算
    automated: true
    runner: budget
    args: []
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.cache_hit_rate
        op: ge
        value: 0.5
      - path: metrics.budget_refusals
        op: ge
        value: 1

  # ---- 扩容（2026-10-15）：多参数用例 + 端到端 + 回归，全部由既有 runner 驱动 ----
  - id: log-002-adc-before
    layer: log
    name: ADC 复现日志（复现规则集）自证
    automated: true
    runner: log
    args: ["examples/adc_sampling_bug/input/serial_before.log", "--rules", "evals/log_rules/adc_repro.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: passed
        op: ge
        value: 5
      - path: failed
        op: eq
        value: 0

  - id: log-003-adc-after
    layer: log
    name: ADC 修复日志（修复规则集）自证
    automated: true
    runner: log
    args: ["examples/adc_sampling_bug/input/serial_after.log", "--rules", "evals/log_rules/adc_fixed.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: passed
        op: ge
        value: 5
      - path: failed
        op: eq
        value: 0

  - id: log-004-pwm-before
    layer: log
    name: UCC20225 复现日志自证
    automated: true
    runner: log
    args: ["examples/pwm_issue/input/serial_before.log", "--rules", "evals/log_rules/pwm_before.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: passed
        op: ge
        value: 4

  - id: log-005-pwm-after
    layer: log
    name: UCC20225 修复日志自证
    automated: true
    runner: log
    args: ["examples/pwm_issue/input/serial_after.log", "--rules", "evals/log_rules/pwm_after.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: passed
        op: ge
        value: 4

  - id: static-002-findings-locked
    layer: static
    name: 静态检查结果锁定（findings=3，防误报膨胀）
    automated: true
    runner: static
    args: ["--diff", "samples/sample.diff"]
    expect:
      - path: findings_count
        op: eq
        value: 3

  - id: static-003-rule-cr003
    layer: static
    name: 静态规则 CR-003 必须命中
    automated: true
    runner: static
    args: ["--diff", "samples/sample.diff"]
    expect:
      - path: rules_triggered
        op: contains
        value: CR-003

  - id: rag-003-recall-at-5
    layer: rag
    name: 检索质量（k=5）不退化
    automated: true
    runner: rag
    args: ["--cases", "evals/rag_cases.yaml", "--k", "5"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.recall_at_k
        op: ge
        value: ${rag_recall3_min}

  - id: rag-004-recall-at-10
    layer: rag
    name: 检索质量（k=10）不退化
    automated: true
    runner: rag
    args: ["--cases", "evals/rag_cases.yaml", "--k", "10"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: rag-005-vector-k5
    layer: rag
    name: 混合检索（k=5）与词法持平
    automated: true
    runner: vector
    args: ["--cases", "evals/rag_cases.yaml", "--k", "5"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.hybrid_recall_at_k
        op: ge
        value: ${vector_recall3_min}

  - id: rag-006-vector-k10
    layer: rag
    name: 混合检索（k=10）与词法持平
    automated: true
    runner: vector
    args: ["--cases", "evals/rag_cases.yaml", "--k", "10"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: memory-002-wider-k
    layer: agent
    name: 项目记忆（k=5）仍能取回历史决策
    automated: true
    runner: memory
    args: ["--k", "5"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.recall_at_k
        op: ge
        value: 1.0

  - id: security-002-audit-path
    layer: security
    name: 审计可写入独立路径
    automated: true
    runner: security
    args: ["--audit", "traces/audit_case002.jsonl"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.guarded_tools
        op: ge
        value: 2

  - id: security-003-checks
    layer: security
    name: 安全边界检查项不少于 8 条
    automated: true
    runner: security
    args: ["--audit", "traces/audit_case003.jsonl"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.checks
        op: ge
        value: 8

  - id: e2e-001-human-gate
    layer: e2e
    name: 端到端：无实机记录时停在人工闸门（退出码 3）
    automated: true
    runner: e2e
    args: ["--mode", "gate"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.exit_code
        op: eq
        value: 3

  - id: e2e-002-done
    layer: e2e
    name: 端到端：提供实机记录后完成（退出码 0）
    automated: true
    runner: e2e
    args: ["--mode", "full"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.exit_code
        op: eq
        value: 0

  - id: e2e-003-mcp-memory
    layer: e2e
    name: 端到端：MCP 工具层 + 项目记忆路径（退出码 0）
    automated: true
    runner: e2e
    args: ["--mode", "mcp"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.exit_code
        op: eq
        value: 0

  - id: regression-001-adc-log
    layer: regression
    name: 回归：ADC 修复后日志断言仍成立
    automated: true
    runner: log
    args: ["examples/adc_sampling_bug/input/serial_after.log", "--rules", "evals/log_rules/adc_fixed.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: regression-002-pwm-log
    layer: regression
    name: 回归：UCC20225 修复后日志断言仍成立
    automated: true
    runner: log
    args: ["examples/pwm_issue/input/serial_after.log", "--rules", "evals/log_rules/pwm_after.yaml"]
    expect:
      - path: status
        op: eq
        value: PASS

  - id: e2e-004-multi-agent
    layer: e2e
    name: 端到端：真 Multi-Agent（各角色独立上下文/工具/任务，退出码 0）
    automated: true
    runner: e2e
    args: ["--mode", "multi"]
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.exit_code
        op: eq
        value: 0

  - id: scenario-001-field-ticket
    layer: scenario
    name: 业务场景：客户现场工单 → 带引用的根因报告与客户回复稿
    automated: true
    runner: scenario
    args: []
    expect:
      - path: status
        op: eq
        value: PASS
      - path: metrics.kb_citations
        op: ge
        value: 1
      - path: metrics.hypotheses
        op: ge
        value: 3
      - path: metrics.report_chars
        op: ge
        value: 600
